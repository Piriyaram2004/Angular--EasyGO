<div class="max-w-6xl mx-auto px-6 py-8">

  <!-- Product count -->
  <p class="text-sm text-gray-500 mb-4">
    Showing {{ filteredProducts.length }} of {{ products.length }} products
  </p>


  <!-- Product Grid -->
  <div
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4
           gap-x-4 gap-y-10 w-full mt-8
           px-6 md:px-16 lg:px-24 xl:px-32"
  >

    <!-- Products -->
    @for (product of filteredProducts; track product.id) {

      <div class="flex justify-center">

        <app-product-card
          [productId]="product.id"
          [name]="product.name"
          [price]="product.price"
          [imageUrl]="product.imageUrl"
          [inStock]="product.inStock"
          [description]="product.description">
        </app-product-card>

      </div>

    }


    <!-- No Products -->
    @empty {

      <div
        class="col-span-full flex flex-col items-center
               justify-center text-center py-20 px-6"
      >

        <p class="text-base font-medium text-gray-700">
          No products match "{{ currentSearchTerm }}"
        </p>

        <p class="text-sm text-gray-400 mt-1">
          Try a different name, like "Galaxy" or "iPhone".
        </p>

      </div>

    }

  </div>

</div>
