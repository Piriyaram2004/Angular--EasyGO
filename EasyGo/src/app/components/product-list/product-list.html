<div class="max-w-6xl mx-auto px-6 py-8">

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

    @for (product of products; track product.id) {

      <app-product-card
        [name]="product.name"
        [price]="product.price"
        [imageUrl]="product.imageUrl"
        (addToCart)="onAddToCart($event)">
      </app-product-card>

    }

  </div>

</div>
