<div class="w-full max-w-6xl mx-auto px-6 py-8">

  <p class="text-sm text-gray-500 mb-5">
    Showing {{ filteredProducts.length }} of {{ products.length }} products
  </p>

  @if (filteredProducts.length > 0) {

    <div
      class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4
             gap-x-5 gap-y-6"
    >

      @for (product of filteredProducts; track product.id) {

        <app-product-card
          class="w-full min-w-0"
          [name]="product.name"
          [price]="product.price"
          [imageUrl]="product.imageUrl"
          [inStock]="product.inStock"
          (addToCart)="onAddToCart($event)">
        </app-product-card>

      }

    </div>

  } @else {

    <div class="flex flex-col items-center justify-center text-center py-20 px-6">

      <p class="text-base font-medium text-gray-700">
        No products match "{{ searchTerm }}"
      </p>

      <p class="text-sm text-gray-400 mt-1">
        Try a different name, like "Galaxy" or "iPhone".
      </p>

    </div>

  }

</div>
