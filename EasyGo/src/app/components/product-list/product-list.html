<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <!-- ===================================================== -->
  <!-- RESULT COUNT -->
  <!-- ===================================================== -->

  <div class="mb-8">

    <p class="text-sm text-gray-500">

      Showing

      <span class="font-semibold text-gray-800">
        {{ filteredProducts.length }}
      </span>

      of

      <span class="font-semibold text-gray-800">
        {{ products.length }}
      </span>

      products

    </p>

  </div>


  <!-- ===================================================== -->
  <!-- PRODUCT GRID -->
  <!-- ===================================================== -->

  <div
    class="grid
           grid-cols-1
           sm:grid-cols-2
           xl:grid-cols-3
           gap-6
           lg:gap-8"
  >

    @for (
      product of filteredProducts;
      track product.id
    ) {

      <app-product-card
        [productId]="product.id"
        [name]="product.name"
        [price]="product.price"
        [imageUrl]="product.imageUrl"
        [inStock]="product.inStock"
        [description]="product.description"
        [productCategory]="product.category"
      />

    } @empty {

      <div
        class="col-span-full
               flex
               flex-col
               items-center
               justify-center
               text-center
               py-20
               px-6"
      >

        <div
          class="w-16
                 h-16
                 rounded-full
                 bg-gray-100
                 flex
                 items-center
                 justify-center
                 text-2xl
                 mb-5"
        >
          🔍
        </div>

        <h3
          class="text-xl
                 font-semibold
                 text-gray-800"
        >
          No products found
        </h3>

        <p class="text-sm text-gray-400 mt-2">
          Try a different name, like "Galaxy" or "iPhone".
        </p>

      </div>

    }

  </div>

</div>
