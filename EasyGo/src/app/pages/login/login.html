<div class="min-h-[70vh] flex items-center justify-center px-6">

  <div
    class="w-full max-w-md
           bg-white
           border border-gray-200
           rounded-2xl
           shadow-sm
           p-8"
  >

    <!-- ================================================= -->
    <!-- TITLE -->
    <!-- ================================================= -->

    <div class="text-center mb-8">

      <h1 class="text-3xl font-semibold text-gray-800">
        Welcome Back
      </h1>

      <p class="text-sm text-gray-500 mt-2">
        Login to continue to EasyGo
      </p>

    </div>


    <!-- ================================================= -->
    <!-- LOGIN FORM -->
    <!-- ================================================= -->

    <form
      (ngSubmit)="login()"
      class="space-y-5"
    >

      <!-- Email -->

      <div>

        <label
          class="block text-sm font-medium
                 text-gray-700 mb-2"
        >
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
          class="w-full
                 border border-gray-300
                 rounded-lg
                 px-4 py-3
                 outline-none
                 focus:border-indigo-500"
        >

      </div>


      <!-- Password -->

      <div>

        <label
          class="block text-sm font-medium
                 text-gray-700 mb-2"
        >
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
          class="w-full
                 border border-gray-300
                 rounded-lg
                 px-4 py-3
                 outline-none
                 focus:border-indigo-500"
        >

      </div>


      <!-- Error -->

      @if (errorMessage) {

        <p
          class="text-sm text-red-500
                 bg-red-50
                 border border-red-100
                 rounded-lg
                 px-4 py-3"
        >
          {{ errorMessage }}
        </p>

      }


      <!-- Login Button -->

      <button
        type="submit"
        class="w-full
               bg-indigo-600
               hover:bg-indigo-700
               text-white
               py-3
               rounded-lg
               transition
               cursor-pointer"
      >
        Login
      </button>

    </form>


    <!-- ================================================= -->
    <!-- DEMO LOGIN -->
    <!-- ================================================= -->

    <div
      class="mt-6
             text-center
             text-xs
             text-gray-400"
    >

      <p>
        Demo account
      </p>

      <p class="mt-1">
        Email: admin&#64;easygo.com
      </p>

      <p>
        Password: 123456
      </p>

    </div>

  </div>

</div>
